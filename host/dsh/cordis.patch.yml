# palimpsest-dsh-host bundle patch.
#
# Mounts three plugins over dsh-base:
#   palimpsest-startup  parses `[message...]`, `--resume <sessionId>`, `--session-file <path>`
#   palimpsest-tools    launches the Palimpsest deployment from a profile and registers its
#                       tools into the REAL DSH tool registry (no stub registry)
#   palimpsest-runner   creates or cold-resumes a persistent principal session and runs an
#                       attention loop that wakes the SAME agent via the real agent service
#
# A profile overrides the palimpsest-tools config by id (see the dogfood profiles):
#   - id: palimpsest-tools
#     config: { palimpsestEntry: <abs dist/src/advanced.js>, deploymentProfile: <abs profile.json>, serve: true, port: 0 }
#
# PTC: this bundle deliberately mounts NO code-runtime entry. It used to insert one named
# `@deepseek-ai/dsh-code-runtime-worker-thread`, which no longer exists in the installed DSH —
# `dsh-base` now mounts `@deepseek-ai/dsh-ptc-runtime-node` itself. The stale entry resolved to
# nothing, so every worker session logged "code-runtime … failed to import" and a PTC-presented
# worker had no working transport to call its tools through. Measured by the D2 live gate, where a
# real worker finished without reporting anything for exactly that reason.

- insert:
    - id: palimpsest-startup
      name: 'palimpsest-dsh-host/startup'

    - id: palimpsest-tools
      name: 'palimpsest-dsh-host'
      config:
        palimpsestEntry: ''
        deploymentProfile: ''
        serve: false
        port: 0

    - id: palimpsest-runner
      name: 'palimpsest-dsh-host/runner'
