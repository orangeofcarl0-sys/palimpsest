# PLMP-WEB-E2E-1 (spec 36, G9-G): the first CI gate for this repository.
#
# Two jobs:
#   unit — the mandatory kernel regression (pnpm test = build + vitest) and
#          the web bundle build (Node 24, pnpm 11).
#   e2e  — the real-kernel browser suite on Chromium only: fresh kernel +
#          web builds, then Playwright. Failure artifacts (Playwright report
#          with retained traces/screenshots) are uploaded on failure only.
#
# Frozen rules (36 号 §9/§40): retries = 0 - flakiness is fixed, never
# retried away; a green run with a stale build is not evidence, so both jobs
# rebuild from source.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:web
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
