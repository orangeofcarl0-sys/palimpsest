name: commit-attribution

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - name: Mark exact head pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context=commit-attribution -f state=pending \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      # A PR contributes Git objects only. The workflow and executable policy come from main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check all incoming commits
        id: attribution
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            git fetch --no-tags --no-recurse-submodules origin "refs/pull/$PR_NUMBER/head"
            test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          fi
          node scripts/repository/commit-attribution.mjs range "$BASE_SHA" "$HEAD_SHA"
      - name: Publish status on exact head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.attribution.outcome }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context=commit-attribution -f state="$state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
